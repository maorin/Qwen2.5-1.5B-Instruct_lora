name: qwen-cloud-poc
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  # PyTorch: 留给 pip 装，可跨平台 (Mac MPS / CUDA Linux 都能命中正确轮子)
  - pip:
      - torch>=2.3.0
      - transformers>=4.45.0
      - peft>=0.13.0
      - trl>=0.11.0
      - datasets>=2.20.0
      - accelerate>=0.34.0
      - mcp>=1.2.0
      - pydantic>=2.6.0
